[workspace]
resolver = "2"
members = [
    "crates/trace-core",
    "crates/trace-schema",
    "crates/trace-storage",
    "crates/trace-normalizer",
    "crates/trace-graph",
    "crates/trace-oracle",
    "crates/trace-replay-planner",
    "crates/trace-cli",
    "crates/trace-viewer",
]
exclude = ["fuzz"]

[workspace.package]
version       = "0.0.0"
edition       = "2021"
rust-version  = "1.85"
license       = "MIT"
authors       = ["SemantxTrace contributors"]
repository    = "https://github.com/PhysShell/SemantixTrace"
homepage      = "https://github.com/PhysShell/SemantixTrace"
documentation = "https://docs.rs/semantxtrace"
readme        = "README.md"
keywords      = ["observability", "ui-testing", "tracing", "wpf", "regression"]
categories    = ["development-tools::testing", "development-tools::debugging"]

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
uuid       = { version = "1", features = ["v4", "serde"] }
thiserror  = "1"
tracing    = "0.1"
clap          = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
miette        = { version = "7", features = ["fancy"] }
sysexits      = "0.8"
trycmd        = "0.15"
petgraph = "0.8"
proptest = "1"
zstd     = "0.13"
tempfile = "3"

[workspace.lints.rust]
unsafe_code                     = "forbid"
missing_docs                    = "warn"
missing_debug_implementations   = "warn"
missing_copy_implementations    = "warn"
rust_2018_idioms                = { level = "warn", priority = -1 }
unreachable_pub                 = "warn"
single_use_lifetimes            = "warn"
unused_qualifications           = "warn"

[workspace.lints.clippy]
pedantic                = { level = "warn", priority = -1 }
nursery                 = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
# Conflicts with the rust `unreachable_pub` lint (one wants pub(crate)
# inside private modules, the other forbids it). We keep unreachable_pub.
redundant_pub_crate     = "allow"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto       = "thin"
strip     = "debuginfo"
