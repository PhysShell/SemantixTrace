name: nightly

# Deep, non-PR-blocking runs mandated by docs/fuzzing.md (nightly deep
# fuzz) and docs/stages/S3 ("all property invariants hold across
# 10 000 generated sessions", executed as the ignored metamorphic
# acceptance test).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  props-10k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: 10k-session property acceptance (S3)
        run: cargo test -p trace-normalizer --release --test metamorphic -- --ignored

  fuzz-deep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [jsonl_parse_v1, upcaster_v1_to_current, normalize_fold, sqlite_query]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Same musl/ASan pinning rationale as the PR-blocking smoke job.
      - name: deep fuzz (30 min, non-blocking per fuzzing.md)
        continue-on-error: true
        run: cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=1800 -rss_limit_mb=2048
