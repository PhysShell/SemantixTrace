name: nightly

# Deep, non-PR-blocking runs mandated by docs/fuzzing.md (nightly deep
# fuzz) and docs/stages/S3 ("all property invariants hold across
# 10 000 generated sessions", executed as the ignored metamorphic
# acceptance test).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  props-10k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: 10k-session property acceptance (S3)
        run: cargo test -p trace-normalizer --release --test metamorphic -- --ignored

  fuzz-deep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [jsonl_parse_v1, upcaster_v1_to_current, normalize_fold, graph_build, oracle_replay, sqlite_query]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Same musl/ASan pinning rationale as the PR-blocking smoke job.
      # "Non-blocking" (fuzzing.md) means PRs are not gated on this run;
      # a scheduled workflow never gates PRs, so a crash finding MUST
      # still turn the run red — no continue-on-error here. Flags per
      # fuzzing.md rule 5: no hang (-timeout), no unbounded allocation
      # (-rss_limit_mb, -malloc_limit_mb).
      - name: deep fuzz (30 min)
        run: cargo +nightly fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=1800 -timeout=10 -rss_limit_mb=2048 -malloc_limit_mb=1024
