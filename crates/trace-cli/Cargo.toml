[package]
name        = "trace-cli"
description = "The `trace` command-line interface for SemantxTrace."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
readme.workspace        = true
keywords.workspace      = true
categories.workspace    = true

[[bin]]
name = "trace"
path = "src/main.rs"

[features]
# zstd is default: the help text unconditionally advertises .jsonl.zst
# inputs, so the shipped binary must keep that promise. Stripped
# builds may opt out with --no-default-features (accepting the
# ZstdUnsupported error path); trace-storage itself stays
# feature-gated so library consumers do not inherit the C toolchain.
default         = ["zstd"]
sqlite          = ["trace-storage/sqlite", "dep:trace-align"]
inductive-miner = ["trace-graph/inductive-miner"]
zstd            = ["trace-storage/zstd"]

[dependencies]
trace-core       = { path = "../trace-core", version = "0.0.0" }
trace-schema     = { path = "../trace-schema", version = "0.0.0" }
trace-storage    = { path = "../trace-storage", version = "0.0.0" }
trace-normalizer = { path = "../trace-normalizer", version = "0.0.0" }
trace-graph      = { path = "../trace-graph", version = "0.0.0" }
trace-oracle     = { path = "../trace-oracle", version = "0.0.0" }
trace-align      = { path = "../trace-align", version = "0.0.0", optional = true }
clap          = { workspace = true }
clap_complete = { workspace = true }
miette        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sysexits      = { workspace = true }
thiserror     = { workspace = true }
uuid          = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
tempfile   = { workspace = true }
trycmd     = { workspace = true }
chrono     = { workspace = true }
uuid       = { workspace = true }
zstd       = { workspace = true }

[lints]
workspace = true
