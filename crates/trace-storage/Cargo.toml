[package]
name        = "trace-storage"
description = "Storage backends (JSONL, SQLite; Parquet planned for S9) for SemantxTrace."
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
readme.workspace        = true
keywords.workspace      = true
categories.workspace    = true

[features]
default = []
# `.zst` archive read support (ADR-0003). Off by default to keep the
# base build free of the zstd C toolchain; CI's --all-features enables it.
zstd    = ["dep:zstd"]
sqlite  = ["dep:rusqlite"]
# Placeholder — the Parquet archive tier lands in S9; the feature
# currently gates no code.
parquet = []

[dependencies]
trace-core   = { path = "../trace-core", version = "0.0.0" }
trace-schema = { path = "../trace-schema", version = "0.0.0" }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
zstd         = { workspace = true, optional = true }
rusqlite     = { workspace = true, optional = true }

[dev-dependencies]
trace-core = { path = "../trace-core", version = "0.0.0" }
chrono     = { workspace = true }
proptest   = { workspace = true }
tempfile   = { workspace = true }
uuid       = { workspace = true }

[lints]
workspace = true
