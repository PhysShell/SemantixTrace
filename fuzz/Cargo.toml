[package]
name      = "trace-fuzz"
version   = "0.0.0"
edition   = "2021"
publish   = false
license   = "MIT"

[package.metadata]
cargo-fuzz = true

# Per ADR-0010 the fuzz/ crate is isolated from the main workspace,
# pins its own nightly toolchain (see rust-toolchain.toml), and is
# the only place where `unsafe_code = "forbid"` does not apply
# (libFuzzer harness requires extern "C" glue).

[dependencies]
libfuzzer-sys    = "0.4"
trace-schema     = { path = "../crates/trace-schema" }
trace-core       = { path = "../crates/trace-core" }
trace-normalizer = { path = "../crates/trace-normalizer" }
trace-graph      = { path = "../crates/trace-graph" }
trace-oracle     = { path = "../crates/trace-oracle" }
trace-storage    = { path = "../crates/trace-storage", features = ["sqlite"] }

[[bin]]
name              = "jsonl_parse_v1"
path              = "fuzz_targets/jsonl_parse_v1.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "upcaster_v1_to_current"
path              = "fuzz_targets/upcaster_v1_to_current.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name              = "normalize_fold"
path              = "fuzz_targets/normalize_fold.rs"
test              = false
doc               = false
bench             = false

[[bin]]
name  = "graph_build"
path  = "fuzz_targets/graph_build.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "oracle_replay"
path  = "fuzz_targets/oracle_replay.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "sqlite_query"
path  = "fuzz_targets/sqlite_query.rs"
test  = false
doc   = false
bench = false
